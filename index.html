<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="keywords"
      content="Automação, Residencial, Instalação, Soluções, Inteligente, Câmera, Segurança, Alarme, Sensor"
    />
    <title>Amazon On - Relatório</title>

    <!-- Favicon -->
    <link
      rel="icon"
      href="Ícone Principal 2.png"
      sizes="32x32"
      type="image/x-icon"
    />

    <!--Símbolo redes sociais-->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />

    <!--Fontes-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!--Ícones Bootstrap-->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <link rel="stylesheet" href="index.css" />

    <!--API Google Maps-->
    <script async
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBGrIjn65-5pICJFsH8DTujJRss1DPcSWE&loading=async&libraries=places&callback=initMap">
    </script>

    <!--Para gerar o PDF-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>


  </head>
  <body>
    <div class="container" id="relatorio">

      <div class = "topo">        
        <img src="Marca Principal 1.png" alt="Logo da Empresa" class="logo"/>
        <section class="topo-info">
          <strong>Amazon On: Soluções Inteligentes</strong> 
          <strong>Telefone: +55 (92) 99500-8182</strong> 
          <strong>CNPJ: 03.203.054/0001-42</strong>
        </section>
      </div>
      
      <h4>Relatório de Serviço</h4>


      <!-- Informações do Cliente -->
      <div class="section">
        <h5>Informações do Cliente</h5>
        <input
          type="text"
          id="cliente-nome"
          placeholder="Nome"
        />

        <input
          type="tel"
          id="cliente-telefone"
          placeholder="(XX) XXXXX-XXXX"
          
        />

        <input id="endereco" type="text" placeholder="Endereço" />

        <input type="text" id="complemento" placeholder="Complemento" not required>

      </div>

      <!-- Tipo de Serviço -->
      <div class="section">
        <h5>Tipo de Serviço</h5>
      
        <div class="form-row">
          <select class="form-select" id="tipo-servico">
            <option selected>Tipo</option>
            <option value="1">Automação</option>
            <option value="2">Instalação</option>
            <option value="3">Configuração</option>
            <option value="4">Manutenção</option>
            <option value="5">Sonorização</option>
            <option value="6">Visita Técnica</option>
          </select> 
      
          <select class="form-select" id="quem-realizou">
            <option selected>Técnico</option>
            <option value="7">Hygo Gabriel</option>
            <option value="8">Dejasi Souza</option>
            <option value="9">Dhiemes Anjos</option>
            <option value="10">Nilson Souza</option>
            <option value="11">Silvio Gabriel</option>
            <option value="12">Hugo Rossete</option>
            <option value="14">Equipe</option>
            <option value="13">R DE L FONSECA EIRELI</option>
          </select> 
      
          <input type="datetime" id="data-servico" />
        </div>
      </div>

      <!-- Fotos do Serviço -->
      <div class="section">
        <h5>Fotos do Serviço</h5>
        <div class="photos" id="photos-container">
          <input type="file" id="fotos" multiple />
        </div>
      </div>

      <!-- Observações -->
      <div class="section">
        <h5>Observações</h5>
        <textarea
          id="observacoes"
          rows="5"
          placeholder="Observações"
        ></textarea>
      </div>

      
    </div>

    <!-- Botão de Gerar PDF -->
    <button class="button" id="gerar-pdf" onclick="funcao_pdf()">Baixar Relatório em PDF</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.3/html2pdf.bundle.min.js"></script>
    <script src="index.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
