<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="keywords"
      content="Automação, Residencial, Instalação, Soluções, Inteligente, Câmera, Segurança, Alarme, Sensor"
    />
    <title>Amazon ON</title>

    <!-- Favicon -->
    <link
      rel="icon"
      href="Ícone Principal 2.png"
      sizes="32x32"
      type="image/x-icon"
    />

    <!--Símbolo redes sociais-->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />

    <!--Fontes-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!--Ícones Bootstrap-->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <link rel="stylesheet" href="index.css" />
    <style>
      /* Personalização com as cores da empresa */
      body {
        background-color: #ffffff; /* Branco */
        font-family: "Roboto";
      }

      .container {
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 10px;
      }

      h1 {
        text-align: center;
      }

      .logo {
        display: block;
        margin: 0 auto 20px;
        width: 150px;
        height: auto;
      }

      .section {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }

      input,
      textarea {
        width: 100%;
        padding: 10px;
        margin-bottom: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
      }

      textarea {
        resize: vertical;
      }

      .photos img {
        width: 45%;
        height: 45%;
        margin-right: 10x;
        margin-bottom: 10px;
        border: 1px solid #ddd;
        object-fit: cover; /* Mantém a proporção da imagem */
        page-break-inside: avoid;
      }

      .button {
        display: inline-block; /* Alterado de block para inline-block */
        text-align: center;
        padding: 10px;
        background-color: #4caf50;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        margin: 20px auto; /* Centraliza o botão */
        display: block; /* Garante que ele fique centralizado no bloco */
      }

      .button:hover {
        background-color: #45a049;
      }
    </style>
  </head>
  <body>
    <div class="container" id="relatorio">
      <h1>Relatório de Serviço</h1>
      <img src="Marca Principal 1.png" alt="Logo da Empresa" class="logo" />

      <!-- Informações da Empresa -->
      <div class="section">
        <h2>Informações da Empresa</h2>
        <p>
          <strong>Nome da Empresa:</strong> Amazon On: Soluções Inteligentes
        </p>
        <p><strong>Telefone:</strong> +55 (92) 99500-8182</p>
        <p><strong>CNPJ:</strong> 03.203.054/0001-42</p>
      </div>

      <!-- Informações do Cliente -->
      <div class="section">
        <h2>Informações do Cliente</h2>
        <label for="cliente-nome">Nome do Cliente:</label>
        <input
          type="text"
          id="cliente-nome"
          placeholder="Digite o nome do cliente"
        />

        <label for="cliente-telefone">Telefone do Cliente:</label>
        <input
          type="text"
          id="cliente-telefone"
          placeholder="Digite o telefone do cliente"
        />

        <label for="cliente-endereco">Endereço do Cliente:</label>
        <input
          type="text"
          id="cliente-endereco"
          placeholder="Digite o endereço do cliente"
        />
      </div>

      <!-- Tipo de Serviço -->
      <div class="section">
        <h2>Tipo de Serviço</h2>
        <label for="servico">Serviço Prestado:</label>
        <input
          type="text"
          id="servico"
          placeholder="Descreva o serviço prestado"
        />
      </div>

      <!-- Fotos do Serviço -->
      <div class="section">
        <h2>Fotos do Serviço</h2>
        <div class="photos" id="photos-container">
          <label for="fotos">Anexar Fotos:</label>
          <input type="file" id="fotos" multiple />
        </div>
      </div>

      <!-- Observações -->
      <div class="section">
        <h2>Observações</h2>
        <label for="observacoes">Detalhes do Serviço Prestado:</label>
        <textarea
          id="observacoes"
          rows="5"
          placeholder="Adicione observações sobre o serviço..."
        ></textarea>
      </div>
    </div>

    <!-- Botão de Gerar PDF -->
    <button class="button" id="gerar-pdf">Baixar Relatório em PDF</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.3/html2pdf.bundle.min.js"></script>
    <script>
      // Função para gerar o PDF exatamente como o layout da página
      document
        .getElementById("gerar-pdf")
        .addEventListener("click", function () {
          var element = document.getElementById("relatorio");
          html2pdf().from(element).save("relatorio-servico.pdf");
        });

      // Adicionando as fotos (pré-visualização e upload ilimitado)
      document
        .getElementById("fotos")
        .addEventListener("change", function (event) {
          var files = event.target.files;
          var container = document.getElementById("photos-container");

          for (var i = 0; i < files.length; i++) {
            var reader = new FileReader();
            reader.onload = function (e) {
              var img = document.createElement("img");
              img.src = e.target.result;
              img.width = 150;
              img.height = 150;
              container.appendChild(img);
            };
            reader.readAsDataURL(files[i]);
          }
        });
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
